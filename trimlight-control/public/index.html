<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lights — Trimlight Edge</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --accent:#3b82f6; --ok:#22c55e; --bad:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 16px; }
  h2 { font-size: 1rem; margin: 0 0 12px; color: var(--muted); font-weight:600; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; }
  button { font: inherit; border:0; border-radius:10px; padding:12px 14px; background:#334155; color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  .row > button { flex:1; }
  select, input[type=number], input[type=email], input[type=password] { width:100%; padding:10px; border-radius:10px; border:1px solid #475569; background:#0f172a; color:var(--text); font:inherit; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:10px 0 4px; }
  input[type=range] { width:100%; }
  .swatches { display:flex; gap:8px; flex-wrap:wrap; }
  .swatches input[type=color] { width:44px; height:44px; border:0; padding:0; background:none; }
  .presets button { font-size:.85rem; padding:8px 10px; }
  .toggle button.on { background:var(--accent); }
  #holidayTabs button { font-weight:600; }
  .themes { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .themes button { text-align:left; padding:10px; }
  .themes .stripe { display:flex; height:8px; border-radius:4px; overflow:hidden; margin-bottom:6px; }
  .themes .stripe span { flex:1; }
  .themes small { display:block; color:var(--muted); font-size:.75rem; margin-top:2px; }
  #msg { min-height:1.2em; font-size:.9rem; margin-top:8px; }
  #msg.ok { color:var(--ok); } #msg.bad { color:var(--bad); }
  .hidden { display:none; }
  .effects button { display:block; width:100%; text-align:left; margin-bottom:6px; }
</style>
</head>
<body>
<main>
  <h1>🎄 Trimlight Edge</h1>

  <section id="login" class="card hidden">
    <h2>Sign in</h2>
    <label>Password</label><input id="password" type="password" autocomplete="current-password">
    <div style="margin-top:12px"><button class="primary" onclick="login()">Sign in</button></div>
  </section>

  <section id="notConfigured" class="card hidden">
    <h2>Not connected yet</h2>
    <p>Add <code>TRIMLIGHT_CLIENT_ID</code> and <code>TRIMLIGHT_CLIENT_SECRET</code> to this app's environment variables, then reload this page.</p>
  </section>

  <div id="app" class="hidden">
    <section class="card">
      <h2>Controller</h2>
      <select id="device" onchange="loadDevice()"></select>
      <div class="row" style="margin-top:12px">
        <button class="primary" onclick="setSwitch('on')">On</button>
        <button onclick="setSwitch('off')">Off</button>
        <button onclick="setSwitch('timer')">Schedule</button>
      </div>
      <div id="msg"></div>
    </section>

    <section class="card">
      <h2>🎨 Themes</h2>
      <div id="holidayTabs" class="toggle row" style="margin-bottom:8px"></div>
      <div class="toggle row" style="margin-bottom:10px">
        <button id="tMove" class="on" onclick="setThemeStill(false)">✨ Moving</button>
        <button id="tStill" onclick="setThemeStill(true)">● Still</button>
      </div>
      <div id="themes" class="themes"></div>
    </section>

    <section class="card">
      <h2>Colors</h2>
      <div class="presets row" style="margin-bottom:12px">
        <button onclick="preset(['#ffffff'])">Warm white</button>
        <button onclick="preset(['#ff0000','#00ff00'])">Christmas</button>
        <button onclick="preset(['#ff7700','#7a00ff'])">Halloween</button>
        <button onclick="preset(['#ff0000','#ffffff','#0000ff'])">USA</button>
        <button onclick="preset(['#00a651','#ffffff'])">St. Patrick's</button>
        <button onclick="preset(['#ff69b4','#ff0000','#ffffff'])">Valentine's</button>
      </div>
      <div id="swatches" class="swatches"></div>
      <div class="row" style="margin-top:8px">
        <button onclick="addColor()">+ Color</button>
        <button onclick="removeColor()">− Color</button>
      </div>
      <label>Animation</label>
      <select id="customMode"><option value="0">Static</option><option value="1">Chase forward</option><option value="2">Chase backward</option><option value="3">Chase middle → out</option><option value="4">Chase out → middle</option><option value="5">Stars (twinkle)</option><option value="6">Breath</option><option value="7">Comet forward</option><option value="8">Comet backward</option><option value="9">Comet middle → out</option><option value="10">Comet out → middle</option><option value="11">Wave forward</option><option value="12">Wave backward</option><option value="13">Wave middle → out</option><option value="14">Wave out → middle</option><option value="15">Strobe</option><option value="16">Fade</option></select>
      <label>LEDs per color: <span id="lpcV">3</span></label>
      <input id="lpc" type="range" min="1" max="30" value="3" oninput="lpcV.textContent=this.value">
      <label>Brightness: <span id="briV">200</span></label>
      <input id="bri" type="range" min="1" max="255" value="200" oninput="briV.textContent=this.value">
      <label>Speed: <span id="spdV">100</span></label>
      <input id="spd" type="range" min="0" max="255" value="100" oninput="spdV.textContent=this.value">
      <div style="margin-top:12px"><button class="primary" style="width:100%" onclick="applyCustom()">Show on lights</button></div>
    </section>

    <section class="card">
      <h2>Built-in animations</h2>
      <label>Animation number (0–179)</label>
      <input id="bMode" type="number" min="0" max="179" value="0">
      <div class="row" style="margin-top:12px">
        <button onclick="bStep(-1)">◀ Prev</button>
        <button class="primary" onclick="applyBuiltin()">Show</button>
        <button onclick="bStep(1)">Next ▶</button>
      </div>
    </section>

    <section class="card">
      <h2>Saved patterns</h2>
      <div id="effects" class="effects"><p style="color:var(--muted)">Loading…</p></div>
    </section>
  </div>
</main>

<script>
let token = localStorage.getItem('tl_token');
let colors = ['#ff0000', '#00ff00'];

function $(id) { return document.getElementById(id); }
function show(id, on = true) { $(id).classList.toggle('hidden', !on); }
function msg(text, ok = true) { const m = $('msg'); m.textContent = text; m.className = ok ? 'ok' : 'bad'; }

async function api(method, path, body) {
  const r = await fetch(path, {
    method,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { localStorage.removeItem('tl_token'); token = null; show('app', false); show('login'); throw new Error('Please sign in'); }
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
}

async function login() {
  const r = await fetch('/api/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: $('password').value }),
  });
  const data = await r.json();
  if (!r.ok) return alert(data.error || 'Login failed');
  token = data.token; localStorage.setItem('tl_token', token); start();
}

// Groups appear at the top of the Controller list. Members are matched by
// controller name (case-insensitive); offline controllers are skipped.
const GROUPS = [
  { id: 'all', label: '★ All lights', names: null },
  { id: 'backyard', label: '★ Backyard (Back, Pergola, Landscape)', names: ['Trimlight Back', 'Pergola', 'Trimlight Landscape'] },
];

let devices = [];

function esc(t) {
  return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const isOnline = d => d.connectivity !== 0;

function groupMembers(group) {
  const wanted = group.names && group.names.map(n => n.toLowerCase());
  return devices.filter(d => isOnline(d) && (!wanted || wanted.includes(String(d.name || '').toLowerCase())));
}

async function start() {
  show('login', !token); show('app', false); show('notConfigured', false);
  if (!token) return;
  const s = await api('GET', '/api/status');
  if (!s.configured) return show('notConfigured');
  show('app');
  renderSwatches();
  renderThemes();
  setThemeStill(themeStill);
  try {
    const res = await api('GET', '/api/devices');
    devices = res.data || res.devices || (Array.isArray(res) ? res : []);
    const groupOpts = GROUPS.filter(g => groupMembers(g).length)
      .map(g => `<option value="group:${g.id}">${esc(g.label)}</option>`).join('');
    const deviceOpts = devices.map(d =>
      `<option value="${esc(d.deviceId)}">${esc(d.name || d.deviceId)}${isOnline(d) ? '' : ' (offline)'}</option>`).join('');
    $('device').innerHTML = (groupOpts + deviceOpts) || '<option value="">No controllers found</option>';
    if (devices.length) loadDevice();
  } catch (e) { msg(e.message, false); }
}

const selected = () => $('device').value;
const selectedGroup = () => selected().startsWith('group:') && GROUPS.find(g => 'group:' + g.id === selected());

// The controllers the buttons act on: one controller, or every online member of a group.
function targets() {
  const g = selectedGroup();
  if (g) return groupMembers(g);
  return devices.filter(d => d.deviceId === selected());
}

async function loadDevice() {
  if (!selected()) return;
  const g = selectedGroup();
  if (g) {
    const names = groupMembers(g).map(d => d.name || d.deviceId);
    $('effects').innerHTML = '<p style="color:var(--muted)">Pick a single controller to run its saved patterns.</p>';
    return msg(`Controls ${names.length}: ${names.join(', ')}`);
  }
  try {
    const d = await api('GET', '/api/devices/' + encodeURIComponent(selected()));
    const effects = d.effects || [];
    $('effects').innerHTML = effects.length
      ? effects.map(e => `<button onclick="runEffect(${Number(e.id)})">${esc(e.name || 'Pattern ' + e.id)}</button>`).join('')
      : '<p style="color:var(--muted)">No saved patterns on this controller.</p>';
    const states = ['Off', 'On', 'Schedule'];
    if (d.switchState !== undefined) msg('Currently: ' + (states[d.switchState] || d.switchState));
  } catch (e) { msg(e.message, false); }
}

// Send the same command to every target controller at once and report the result.
async function doIt(label, pathSuffix, body) {
  const list = targets();
  if (!list.length) return msg('No online controllers selected', false);
  msg(label + '…');
  const results = await Promise.allSettled(list.map(d =>
    api('POST', `/api/devices/${encodeURIComponent(d.deviceId)}/${pathSuffix}`, body)));
  const failed = results.map((r, i) => r.status === 'rejected' ? `${list[i].name || list[i].deviceId}: ${r.reason.message}` : null).filter(Boolean);
  if (!failed.length) return msg(label + ' ✓' + (list.length > 1 ? ` (${list.length} controllers)` : ''));
  msg(`${label}: ${list.length - failed.length} of ${list.length} worked. ${failed.join('; ')}`, false);
}

function setSwitch(state) { doIt('Lights ' + state, 'switch', { state }); }
function runEffect(id) { doIt('Pattern started', `effects/${id}/run`); }
function applyCustom() {
  doIt('Colors applied', 'custom', {
    colors, mode: +$('customMode').value, ledsPerColor: +$('lpc').value, brightness: +$('bri').value, speed: +$('spd').value,
  });
}
function applyBuiltin() {
  doIt('Animation ' + $('bMode').value, 'builtin', {
    mode: +$('bMode').value, brightness: +$('bri').value, speed: +$('spd').value,
  });
}
function bStep(n) { $('bMode').value = Math.max(0, Math.min(179, +$('bMode').value + n)); applyBuiltin(); }

function renderSwatches() {
  $('swatches').innerHTML = colors.map((c, i) =>
    `<input type="color" value="${c}" oninput="colors[${i}]=this.value">`).join('');
}
function addColor() { if (colors.length < 30) { colors.push('#ffffff'); renderSwatches(); } }
function removeColor() { if (colors.length > 1) { colors.pop(); renderSwatches(); } }
// opts (optional): { mode, speed, brightness, ledsPerColor }. Updates the sliders so a theme can be tweaked.
function preset(list, opts = {}) {
  colors = [...list];
  renderSwatches();
  const set = (id, labelId, v) => { if (v !== undefined) { $(id).value = v; if (labelId) $(labelId).textContent = v; } };
  set('customMode', null, opts.mode ?? 0);
  set('lpc', 'lpcV', opts.ledsPerColor);
  set('bri', 'briV', opts.brightness);
  set('spd', 'spdV', opts.speed);
  applyCustom();
}

// Mode numbers match the Animation list:
//  0 Static · 1 Chase fwd · 2 Chase back · 3 Chase mid→out · 5 Stars · 6 Breath · 7 Comet fwd · 8 Comet back
//  9 Comet mid→out · 11 Wave fwd · 12 Wave back · 13 Wave mid→out · 16 Fade
const T = (name, note, colors, mode, ledsPerColor, brightness, speed) => ({ name, note, colors, mode, ledsPerColor, brightness, speed });

const HOLIDAYS = [
  { id: 'christmas', label: '🎄 Christmas', themes: [
    T('Classic Christmas', 'Red & green chasing', ['#ff0000', '#00c800'], 1, 4, 220, 40),
    T('Candy Cane', 'Red & white stripes', ['#ff0000', '#ffffff'], 1, 4, 220, 60),
    T('Peppermint Twist', 'Red, white & pink swirl', ['#ff0000', '#ffffff', '#ff4f8b', '#ffffff'], 13, 3, 220, 90),
    T('Santa\'s Sleigh', 'Red & gold racing comets', ['#ff0000', '#ffd27f', '#ffb300'], 7, 4, 240, 170),
    T('Rudolph', 'One red nose leading the way', ['#ff0000', '#ffd8a0', '#ffd8a0', '#ffd8a0', '#ffd8a0'], 7, 3, 230, 120),
    T('Winter Wonderland', 'Icy blue & white twinkle', ['#ffffff', '#7fd4ff', '#2a7fff', '#d6f2ff'], 5, 2, 210, 80),
    T('Let It Snow', 'Snow drifting down', ['#ffffff', '#cfe9ff', '#ffffff', '#5aa9ff'], 8, 3, 200, 60),
    T('Christmas Eve', 'Soft twinkling warm white', ['#ffd27f', '#ffb347', '#fff1d6'], 5, 2, 170, 60),
    T('Silver & Gold', 'Elegant slow fade', ['#ffc400', '#fff1d6', '#ffffff', '#ffb000'], 16, 6, 210, 35),
    T('Retro Bulbs', 'Old-school multicolor C9 bulbs', ['#ff0000', '#00c800', '#0040ff', '#ff8c00', '#ffd400'], 0, 3, 230, 0),
    T('Holly Jolly', 'Green, red & gold breathing', ['#00a000', '#ff0000', '#ffb300'], 6, 5, 220, 55),
    T('Gingerbread House', 'Spice, icing & candy', ['#b84a00', '#ffffff', '#ff0000', '#b84a00', '#ffffff', '#00c800'], 0, 3, 220, 0),
    T('The Grinch', 'Grinch green with a red heart', ['#5aff00', '#5aff00', '#5aff00', '#ff0000'], 6, 4, 230, 70),
    T('Nutcracker', 'Red, gold & royal blue march', ['#ff0000', '#ffb300', '#1a3cff'], 11, 4, 230, 90),
    T('Blue Christmas', 'Deep blue & white glow', ['#0030ff', '#ffffff'], 6, 5, 210, 45),
    T('Elf Party', 'Fast & fun red, green, white, yellow', ['#ff0000', '#00c800', '#ffffff', '#ffd400'], 2, 3, 240, 200),
    T('Northern Lights', 'Teal, green & purple waves', ['#00ffa0', '#00b4ff', '#7a00ff', '#00ff40'], 11, 8, 220, 50),
    T('Midnight Mass', 'Gold & warm white from the center', ['#ffb300', '#fff1d6', '#ffd27f'], 9, 4, 220, 70),
  ]},
  { id: 'thanksgiving', label: '🦃 Thanksgiving', themes: [
    T('Harvest Glow', 'Warm amber & gold, steady', ['#ff6a00', '#ffb000', '#ff8c00'], 0, 5, 190, 0),
    T('Autumn Leaves', 'Red, orange & gold drifting', ['#c81e00', '#ff5a00', '#ffb300', '#ff7a00'], 1, 4, 210, 35),
    T('Pumpkin Pie', 'Pumpkin orange with cream', ['#ff5000', '#ff5000', '#ffd9a0'], 0, 3, 200, 0),
    T('Cranberry & Gold', 'Slow breathing glow', ['#b0002a', '#ffb300'], 6, 6, 220, 50),
    T('Candlelight Dinner', 'Soft flickering warm white', ['#ffb347', '#ff8c1a', '#ffd27f'], 5, 2, 140, 70),
    T('Turkey Trot', 'Festive moving wave', ['#8b2500', '#ff6a00', '#ffc400', '#c81e00'], 11, 5, 230, 120),
    T('Golden Hour', 'Gold fading to sunset', ['#ffc400', '#ff7a00', '#ff3c00'], 16, 8, 200, 40),
    T('Gratitude', 'Gold comets from the center', ['#ffd27f', '#ff9a00', '#ffffff'], 9, 4, 220, 90),
  ]},
];

// Remember the last holiday tab; default to Thanksgiving in November, Christmas otherwise.
let holiday = localStorage.getItem('tl_holiday') || (new Date().getMonth() === 10 ? 'thanksgiving' : 'christmas');
const currentThemes = () => (HOLIDAYS.find(h => h.id === holiday) || HOLIDAYS[0]).themes;

function setHoliday(id) {
  holiday = id;
  localStorage.setItem('tl_holiday', id);
  renderThemes();
}

function renderThemes() {
  $('holidayTabs').innerHTML = HOLIDAYS.map(h =>
    `<button class="${h.id === holiday ? 'on' : ''}" onclick="setHoliday('${h.id}')">${h.label}</button>`).join('');
  $('themes').innerHTML = currentThemes().map((t, i) =>
    `<button onclick="applyTheme(${i})"><div class="stripe">${t.colors.map(c => `<span style="background:${c}"></span>`).join('')}</div>` +
    `${esc(t.name)}<small>${esc(t.note)}</small></button>`).join('');
}
// "Still" shows the same theme colors without animation.
let themeStill = localStorage.getItem('tl_theme_still') === '1';
function setThemeStill(still) {
  themeStill = still;
  localStorage.setItem('tl_theme_still', still ? '1' : '0');
  $('tMove').classList.toggle('on', !still);
  $('tStill').classList.toggle('on', still);
}
function applyTheme(i) {
  const t = currentThemes()[i];
  preset(t.colors, themeStill ? { ...t, mode: 0 } : t);
}

start();
</script>
</body>
</html>
