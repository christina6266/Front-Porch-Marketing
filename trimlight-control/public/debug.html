<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lights — Diagnostics</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --accent:#3b82f6; --ok:#22c55e; --bad:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3rem; }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; }
  p { color:var(--muted); font-size:.9rem; }
  button { font: inherit; border:0; border-radius:10px; padding:12px 14px; background:#334155; color:var(--text); width:100%; margin-top:8px; }
  button.primary { background:var(--accent); }
  select { width:100%; padding:10px; border-radius:10px; border:1px solid #475569; background:#0f172a; color:var(--text); font:inherit; }
  pre { white-space:pre-wrap; word-break:break-all; font-size:.72rem; background:#0b1222; padding:10px; border-radius:10px; max-height:420px; overflow:auto; }
  #status { min-height:1.2em; font-size:.9rem; }
  a { color:var(--muted); }
</style>
</head>
<body>
<main>
  <p><a href="./">← Back to lights</a></p>
  <h1>🔧 Diagnostics</h1>
  <div class="card">
    <p>This checks what a controller reports, so problems can be tracked down. Pick a controller, run the two tests, watch your lights, then tap <b>Copy report</b> and paste it into the chat.</p>
    <select id="device"></select>
    <button onclick="testBuiltin()">Test A: Trimlight's own rainbow animation</button>
    <button onclick="testCustom()">Test B: our red &amp; green chase</button>
    <button onclick="readDevice()">Read controller</button>
    <button class="primary" onclick="copyReport()">📋 Copy report</button>
    <div id="status"></div>
  </div>
  <div class="card"><pre id="out">Nothing yet.</pre></div>
</main>
<script>
const token = localStorage.getItem('tl_token');
const $ = id => document.getElementById(id);
const notes = [];
let lastDetail = null;

function status(t, ok = true) { $('status').textContent = t; $('status').style.color = ok ? 'var(--ok)' : 'var(--bad)'; }
async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Request failed');
  return d;
}

// Short summary of one effect, as the controller stores it.
function fx(e) {
  if (!e) return null;
  const lit = Array.isArray(e.pixels) ? e.pixels.filter(p => p.count > 0) : null;
  return {
    id: e.id, name: e.name, category: e.category, mode: e.mode, speed: e.speed, brightness: e.brightness,
    pixelLen: e.pixelLen, reverse: e.reverse,
    pixels: lit ? `${lit.length} lit of ${e.pixels.length}: ` + lit.map(p => `${p.count}×#${p.color.toString(16).padStart(6, '0')}${p.disable ? '(off)' : ''}`).join(' ') : undefined,
    otherFields: Object.keys(e).filter(k => !['id','name','category','mode','speed','brightness','pixelLen','reverse','pixels'].includes(k)),
  };
}

function render() {
  const d = lastDetail || {};
  const report = {
    page: 'Lights app diagnostics', at: new Date().toString(),
    controller: $('device').selectedOptions[0]?.textContent,
    firmware: d.fwVersionName, switchState: d.switchState, connectivity: d.connectivity, state: d.state, ic: d.ic, colorOrder: d.colorOrder,
    ports: d.ports, currentEffect: fx(d.currentEffect), overlayEffects: d.overlayEffects, combinedEffect: d.combinedEffect,
    savedEffects: (d.effects || []).map(fx), dailySchedules: d.daily, otherTopFields: Object.keys(d).filter(k => !['name','switchState','connectivity','state','colorOrder','ic','ports','fwVersionName','effects','combinedEffect','daily','calendar','currentEffect','overlayEffects','currentDatetime'].includes(k)),
    notes,
  };
  $('out').textContent = JSON.stringify(report, null, 1);
  return report;
}

async function readDevice() {
  status('Reading controller… (about 5 seconds)');
  try {
    const r = await api('GET', '/api/debug/device/' + encodeURIComponent($('device').value));
    lastDetail = r.detail; notes.push(`read: shadow=${r.shadow}`); render(); status('Controller read ✓');
  } catch (e) { status(e.message, false); notes.push('read error: ' + e.message); render(); }
}

async function runTest(label, path, body) {
  status(label + '…');
  try {
    const r = await api('POST', `/api/devices/${encodeURIComponent($('device').value)}/${path}`, body);
    notes.push(`${label}: sent OK ${JSON.stringify(r)}`);
    status(label + ' sent ✓ Watch the lights for 10 seconds…');
    await new Promise(res => setTimeout(res, 3000));
    await readDevice();
    const log = await api('GET', '/api/debug/log');
    notes.push(`${label} calls: ` + JSON.stringify(log.calls.slice(-4)));
    render();
    status(`${label} done. Did the lights MOVE? Note it, then run the other test.`);
  } catch (e) { status(e.message, false); notes.push(`${label} error: ${e.message}`); render(); }
}
const testBuiltin = () => runTest('Test A (built-in rainbow, mode 0)', 'builtin', { mode: 0, speed: 180, brightness: 220 });
const testCustom = () => runTest('Test B (custom red/green chase, mode 1)', 'custom', { zones: [{ color: '#ff0000', count: 5 }, { color: '#00ff00', count: 5 }], mode: 1, speed: 200, brightness: 220 });

async function copyReport() {
  const text = JSON.stringify(render(), null, 1);
  try { await navigator.clipboard.writeText(text); status('Report copied ✓ Paste it into the chat.'); }
  catch {
    const r = document.createRange(); r.selectNodeContents($('out'));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    status('Text selected: tap Copy, then paste it into the chat.');
  }
}

(async () => {
  if (!token) { status('Please sign in on the main page first.', false); return; }
  try {
    const res = await api('GET', '/api/devices');
    const list = res.data || res.devices || [];
    $('device').innerHTML = list.map(d => `<option value="${d.deviceId}">${(d.name || d.deviceId).replace(/[<>&]/g, '')}${d.connectivity === 0 ? ' (offline)' : ''}</option>`).join('');
  } catch (e) { status(e.message, false); }
})();
</script>
</body>
</html>
